<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Automated job hunting system powered by AI and Django">
    <title>{% block title %}Job Hunt Bot{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1)',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1)',
                        'slide-down': 'slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1)',
                        'shimmer': 'shimmer 2s linear infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(30px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        slideDown: {
                            '0%': { transform: 'translateY(-20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '-1000px 0' },
                            '100%': { backgroundPosition: '1000px 0' },
                        },
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

        body {
            font-family: 'DM Sans', sans-serif;
        }

        /* Custom glossy card effect */
        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass-card-light {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }



        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(59, 130, 246, 0.7);
        }
    </style>
</head>

<body class="dark:bg-gray-950 bg-gray-50 min-h-screen flex flex-col transition-colors duration-300">
    <!-- Navigation -->
    <nav
        class="sticky bg-white dark:bg-gray-950 top-0 z-50 dark:glass-card glass-card-light backdrop-blur-xl border-b dark:border-white/10 border-gray-200 shadow-2xl animate-slide-down">
        <div class="container mx-auto px-4 lg:px-8">
            <div class="flex justify-between items-center h-14 md:h-16">
                <!-- Logo and Brand -->
                <a href="{% url 'home' %}" class="flex items-center space-x-2 md:space-x-3 group">
                    <div
                        class="w-8 h-8 md:w-10 md:h-10 bg-blue-600 rounded-xl flex items-center justify-center transform group-hover:scale-110 transition-all duration-300 shadow-lg shadow-blue-500/50">
                        <svg class="w-5 h-5 md:w-6 md:h-6 text-white" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <span class="text-base md:text-xl font-bold dark:text-white text-gray-900">
                        Job Hunt Bot
                    </span>
                </a>

                <!-- Navigation Links -->
                <div class="flex items-center space-x-0.5 md:space-x-1">
                    <a href="{% url 'home' %}"
                        class="px-2 md:px-4 py-2 dark:text-gray-300 dark:hover:text-white text-gray-700 hover:text-gray-900 text-sm md:text-base font-medium transition-all duration-200 relative group rounded-lg dark:hover:bg-white/5 hover:bg-gray-200/50">
                        <span>Home</span>
                        <span
                            class="absolute bottom-1 left-2 md:left-4 right-2 md:right-4 h-0.5 bg-blue-600 scale-x-0 group-hover:scale-x-100 transition-transform duration-200"></span>
                    </a>
                    <a href="{% url 'job_list' %}"
                        class="px-2 md:px-4 py-2 dark:text-gray-300 dark:hover:text-white text-gray-700 hover:text-gray-900 text-sm md:text-base font-medium transition-all duration-200 relative group rounded-lg dark:hover:bg-white/5 hover:bg-gray-200/50">
                        <span>Dashboard</span>
                        <span
                            class="absolute bottom-1 left-2 md:left-4 right-2 md:right-4 h-0.5 bg-blue-600 scale-x-0 group-hover:scale-x-100 transition-transform duration-200"></span>
                    </a>
                    <a href="/admin/"
                        class="px-2 md:px-4 py-2 dark:text-gray-300 dark:hover:text-white text-gray-700 hover:text-gray-900 text-sm md:text-base font-medium transition-all duration-200 relative group rounded-lg dark:hover:bg-white/5 hover:bg-gray-200/50">
                        <span>Admin</span>
                        <span
                            class="absolute bottom-1 left-2 md:left-4 right-2 md:right-4 h-0.5 bg-blue-600 scale-x-0 group-hover:scale-x-100 transition-transform duration-200"></span>
                    </a>

                    <!-- Dark Mode Toggle -->
                    <button onclick="toggleDarkMode()"
                        class="ml-2 p-2 rounded-lg dark:bg-white/5 dark:hover:bg-white/10 bg-gray-200 hover:bg-gray-300 transition-all duration-200 group"
                        aria-label="Toggle dark mode">
                        <svg class="w-5 h-5 text-gray-300 group-hover:text-white transition-colors hidden dark:block"
                            fill="currentColor" viewBox="0 0 20 20">
                            <path
                                d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z">
                            </path>
                        </svg>
                        <svg class="w-5 h-5 text-gray-700 group-hover:text-gray-900 transition-colors block dark:hidden"
                            fill="currentColor" viewBox="0 0 20 20">
                            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 lg:px-8 py-8 animate-fade-in">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer
        class="dark:glass-card bg-white dark:bg-gray-950 glass-card-lightzx border-t dark:border-white/10 border-gray-200 mt-auto">
        <div class="container mx-auto px-4 lg:px-8 py-8">
            <div class="flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
                <div class="text-center md:text-left">
                    <p class="dark:text-gray-300 text-gray-700 font-semibold">
                        Automated Job Hunting System
                    </p>
                    <p class="text-sm dark:text-gray-500 text-gray-600">
                        Powered by Django & AI
                    </p>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="https://github.com/dreww01" target="_blank" rel="noopener noreferrer"
                        class="dark:text-gray-400 text-gray-600 dark:hover:text-white hover:text-gray-900 transition-all duration-200 transform hover:scale-110">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z" />
                        </svg>
                    </a>
                    <a href="https://twitter.com/drewfx01" target="_blank" rel="noopener noreferrer"
                        class="dark:text-gray-400 text-gray-600 dark:hover:text-white hover:text-gray-900 transition-all duration-200 transform hover:scale-110">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z" />
                        </svg>
                    </a>
                    <a href="https://www.linkedin.com/in/onwe-andrew-774194249" target="_blank"
                        rel="noopener noreferrer"
                        class="dark:text-gray-400 text-gray-600 dark:hover:text-white hover:text-gray-900 transition-all duration-200 transform hover:scale-110">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
                        </svg>
                    </a>
                </div>
            </div>
            <div class="mt-6 pt-6 border-t dark:border-white/10 border-gray-200 text-center">
                <p class="text-sm dark:text-gray-500 text-gray-600">
                    &copy; 2025 Job Hunt Bot. All rights reserved.
                </p>
            </div>
        </div>
    </footer>

    <!-- Dark Mode Script -->
    <script>
        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('darkMode', 'false');
            } else {
                html.classList.add('dark');
                localStorage.setItem('darkMode', 'true');
            }
        }

        // Always default to dark mode
        if (localStorage.getItem('darkMode') !== 'false') {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>

</html>
