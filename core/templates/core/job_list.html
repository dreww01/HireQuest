{% extends 'core/base.html' %}

{% block title %}Job Listings - Job Hunt Bot{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto" x-data="jobListApp()">
    <!-- Header -->
    <div class="mb-8 animate-slide-up">
        <h1 class="text-5xl font-bold dark:text-white text-gray-900 mb-3">Job Opportunities</h1>
        <p class="text-lg dark:text-gray-400 text-gray-600">
            <span x-text="filteredJobs.length"></span> job<span x-show="filteredJobs.length !== 1">s</span> found
        </p>
    </div>

    <!-- Filter Section -->
    <div class="glass-card rounded-3xl p-4 md:p-6 mb-8 animate-slide-up">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
            <!-- Search Filter -->
            <div>
                <label class="block text-xs md:text-sm font-semibold dark:text-gray-300 text-gray-700 mb-1.5 md:mb-2">Search</label>
                <input
                    type="text"
                    x-model="searchQuery"
                    @input="filterJobs()"
                    placeholder="Search by title, author..."
                    class="w-full px-3 md:px-4 py-2.5 md:py-3 text-sm md:text-base dark:bg-white/5 bg-white dark:border-white/20 border-gray-300 rounded-lg md:rounded-xl dark:text-white text-gray-900 dark:placeholder-gray-500 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                >
            </div>

            <!-- Status Filter -->
            <div>
                <label class="block text-xs md:text-sm font-semibold dark:text-gray-300 text-gray-700 mb-1.5 md:mb-2">Status</label>
                <select
                    x-model="statusFilter"
                    @change="filterJobs()"
                    class="w-full px-3 md:px-4 py-2.5 md:py-3 text-sm md:text-base dark:bg-white/5 bg-white dark:border-white/20 border-gray-300 rounded-lg md:rounded-xl dark:text-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                >
                    <option value="" class="dark:bg-gray-800 bg-white">All Statuses</option>
                    <option value="new" class="dark:bg-gray-800 bg-white">New</option>
                    <option value="alerted" class="dark:bg-gray-800 bg-white">Alerted</option>
                    <option value="sent" class="dark:bg-gray-800 bg-white">Sent</option>
                    <option value="closed" class="dark:bg-gray-800 bg-white">Closed</option>
                </select>
            </div>

            <!-- Classification Filter -->
            <div>
                <label class="block text-xs md:text-sm font-semibold dark:text-gray-300 text-gray-700 mb-1.5 md:mb-2">Classification</label>
                <select
                    x-model="classificationFilter"
                    @change="filterJobs()"
                    class="w-full px-3 md:px-4 py-2.5 md:py-3 text-sm md:text-base dark:bg-white/5 bg-white dark:border-white/20 border-gray-300 rounded-lg md:rounded-xl dark:text-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                >
                    <option value="" class="dark:bg-gray-800 bg-white">All Classifications</option>
                    <option value="high" class="dark:bg-gray-800 bg-white">High Match</option>
                    <option value="medium" class="dark:bg-gray-800 bg-white">Medium Match</option>
                    <option value="ignore" class="dark:bg-gray-800 bg-white">Ignore</option>
                </select>
            </div>

            <!-- Reset Button -->
            <div class="flex items-end">
                <button
                    @click="resetFilters()"
                    class="w-full px-3 md:px-4 py-2.5 md:py-3 text-sm md:text-base dark:bg-white/5 dark:hover:bg-white/10 dark:border-white/20 dark:hover:border-white/40 dark:text-white bg-gray-200 hover:bg-gray-300 border-gray-300 hover:border-gray-400 text-gray-900 rounded-lg md:rounded-xl font-medium transition-all duration-300"
                >
                    Reset Filters
                </button>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div x-show="filteredJobs.length === 0" class="text-center py-20 animate-fade-in">
        <div class="w-24 h-24 bg-white/5 border border-white/10 rounded-3xl flex items-center justify-center mx-auto mb-6">
            <svg class="w-12 h-12 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </div>
        <h3 class="text-3xl font-bold dark:text-white text-gray-900 mb-3">No jobs found</h3>
        <p class="dark:text-gray-400 text-gray-600 mb-8 text-lg">Try adjusting your filters or search query</p>
        <button
            @click="resetFilters()"
            class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold transition-all duration-300 shadow-lg shadow-blue-500/30"
        >
            Clear Filters
        </button>
    </div>

    <!-- Job Cards Grid -->
    <template x-if="filteredJobs.length > 0">
        <div class="grid grid-cols-1 gap-5">
            <template x-for="job in filteredJobs" :key="job.id">
                <div
                    class="glass-card rounded-3xl p-4 md:p-6 transition-all duration-300 hover:shadow-2xl animate-fade-in border-l-4"
                    :class="getUserStatusBorderClass(job.user_status)"
                >
                    <div class="flex flex-col gap-4 md:gap-6">
                        <!-- Job Info -->
                        <div class="flex-1 min-w-0">
                            <!-- Title and Badge Row -->
                            <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-2 sm:gap-4 mb-3">
                                <a :href="'/jobs/' + job.id + '/'" class="group flex-1 min-w-0 order-1">
                                    <h3 class="text-lg sm:text-xl md:text-2xl font-bold dark:text-white text-gray-900 group-hover:text-blue-400 transition-colors line-clamp-2">
                                        <span x-text="job.title"></span>
                                    </h3>
                                </a>
                                <span
                                    class="px-3 py-1.5 md:px-4 md:py-2 rounded-lg md:rounded-xl text-xs md:text-sm font-bold whitespace-nowrap self-start border order-2"
                                    :class="getClassificationBadgeClass(job.qualification?.classification)"
                                >
                                    <span x-text="getClassificationDisplay(job.qualification?.classification)"></span>
                                </span>
                            </div>

                            <!-- Author -->
                            <p class="text-xs md:text-sm dark:text-gray-400 text-gray-600 mb-2 md:mb-3 flex items-center">
                                <svg class="w-3.5 h-3.5 md:w-4 md:h-4 mr-1.5 md:mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                <span x-text="job.author" class="truncate"></span>
                            </p>

                            <!-- Description -->
                            <p class="dark:text-gray-400 text-gray-600 text-xs md:text-sm line-clamp-2 leading-relaxed">
                                <span x-text="job.body.replace(/\n/g, ' ').substring(0, 200) + (job.body.length > 200 ? '...' : '')"></span>
                            </p>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex flex-col sm:flex-row gap-2 md:gap-3">
                            <button
                                @click.prevent="updateUserStatus(job.id, 'applied')"
                                :disabled="job.user_status === 'applied'"
                                class="flex-1 px-4 py-2.5 md:px-5 md:py-3 rounded-lg md:rounded-xl font-semibold transition-all duration-300 text-xs md:text-sm disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 border"
                                :class="job.user_status === 'applied' ? 'bg-green-500 text-white border-green-400 shadow-lg shadow-green-500/30' : 'bg-green-500/10 border-green-500/30 text-green-400 hover:bg-green-500/20'"
                            >
                                <svg class="w-3.5 h-3.5 md:w-4 md:h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                                <span x-show="job.user_status === 'applied'">Applied</span>
                                <span x-show="job.user_status !== 'applied'">Mark Applied</span>
                            </button>

                            <button
                                @click.prevent="updateUserStatus(job.id, 'ignored')"
                                :disabled="job.user_status === 'ignored'"
                                class="flex-1 px-4 py-2.5 md:px-5 md:py-3 rounded-lg md:rounded-xl font-semibold transition-all duration-300 text-xs md:text-sm disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 border"
                                :class="job.user_status === 'ignored' ? 'bg-red-500 text-white border-red-400 shadow-lg shadow-red-500/30' : 'bg-red-500/10 border-red-500/30 text-red-400 hover:bg-red-500/20'"
                            >
                                <svg class="w-3.5 h-3.5 md:w-4 md:h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                                <span x-show="job.user_status === 'ignored'">Ignored</span>
                                <span x-show="job.user_status !== 'ignored'">Ignore</span>
                            </button>

                            <button
                                @click.prevent="deleteJob(job.id)"
                                class="flex-1 px-4 py-2.5 md:px-5 md:py-3 dark:bg-white/5 dark:hover:bg-white/10 dark:border-white/20 dark:hover:border-white/40 dark:text-gray-300 dark:hover:text-white bg-gray-200 hover:bg-gray-300 border-gray-300 hover:border-gray-400 text-gray-700 hover:text-gray-900 rounded-lg md:rounded-xl font-semibold transition-all duration-300 text-xs md:text-sm flex items-center justify-center gap-2"
                            >
                                <svg class="w-3.5 h-3.5 md:w-4 md:h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                                <span class="hidden sm:inline">Delete</span>
                                <span class="sm:hidden">Del</span>
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </template>
</div>

<script>
function jobListApp() {
    return {
        jobs: {{ jobs_json|safe }},
        searchQuery: '',
        statusFilter: '',
        classificationFilter: '',
        filteredJobs: [],

        init() {
            this.filterJobs();
        },

        filterJobs() {
            this.filteredJobs = this.jobs.filter(job => {
                const matchesSearch = !this.searchQuery ||
                    job.title.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                    job.author.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                    job.body.toLowerCase().includes(this.searchQuery.toLowerCase());

                const matchesStatus = !this.statusFilter || job.status === this.statusFilter;

                const matchesClassification = !this.classificationFilter ||
                    job.qualification?.classification === this.classificationFilter;

                return matchesSearch && matchesStatus && matchesClassification;
            });
        },

        resetFilters() {
            this.searchQuery = '';
            this.statusFilter = '';
            this.classificationFilter = '';
            this.filterJobs();
        },

        async updateUserStatus(jobId, newStatus) {
            try {
                const response = await fetch(`/api/jobs/${jobId}/user-status/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ user_status: newStatus })
                });

                const data = await response.json();

                if (data.success) {
                    const job = this.jobs.find(j => j.id === jobId);
                    if (job) {
                        job.user_status = newStatus;
                        this.filterJobs();
                    }
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                console.error('Error updating user status:', error);
                alert('Failed to update status. Please try again.');
            }
        },

        async deleteJob(jobId) {
            if (!confirm('Are you sure you want to delete this job? This action cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`/api/jobs/${jobId}/delete/`, {
                    method: 'DELETE',
                });

                const data = await response.json();

                if (data.success) {
                    this.jobs = this.jobs.filter(j => j.id !== jobId);
                    this.filterJobs();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                console.error('Error deleting job:', error);
                alert('Failed to delete job. Please try again.');
            }
        },

        getUserStatusBorderClass(userStatus) {
            const classes = {
                'applied': 'border-green-500 shadow-lg shadow-green-500/20',
                'ignored': 'border-red-500 shadow-lg shadow-red-500/20',
                'pending': 'border-orange-500 shadow-lg shadow-orange-500/20'
            };
            return classes[userStatus] || 'border-white/10';
        },

        getStatusDisplay(status) {
            const statusMap = {
                'new': 'New',
                'alerted': 'Alerted',
                'sent': 'Sent',
                'closed': 'Closed'
            };
            return statusMap[status] || status;
        },

        getStatusBadgeClass(status) {
            const classes = {
                'new': 'bg-blue-500/10 border-blue-500/30 text-blue-400',
                'alerted': 'bg-yellow-500/10 border-yellow-500/30 text-yellow-400',
                'sent': 'bg-green-500/10 border-green-500/30 text-green-400',
                'closed': 'bg-gray-500/10 border-gray-500/30 text-gray-400'
            };
            return classes[status] || 'bg-gray-500/10 border-gray-500/30 text-gray-400';
        },

        getClassificationDisplay(classification) {
            const classMap = {
                'high': 'High Match',
                'medium': 'Medium Match',
                'ignore': 'Ignore'
            };
            return classMap[classification] || 'Unclassified';
        },

        getClassificationBadgeClass(classification) {
            const classes = {
                'high': 'bg-green-500/10 border-green-500/30 text-green-400',
                'medium': 'bg-orange-500/10 border-orange-500/30 text-orange-400',
                'ignore': 'bg-red-500/10 border-red-500/30 text-red-400'
            };
            return classes[classification] || 'bg-gray-500/10 border-gray-500/30 text-gray-400';
        }
    }
}
</script>
{% endblock %}
