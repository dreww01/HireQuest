[project]
name = "hirequest"
version = "0.1.0"
description = "Automated job hunting system with AI qualification"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "celery>=5.6.0",
    "coverage>=7.13.0",
    "django>=5.0,<5.1",
    "django-celery-beat>=2.8.1",
    "django-cron>=0.6.0",
    "django-environ>=0.12.0",
    "django-unfold>=0.74.1",
    "feedparser>=6.0.12",
    "huggingface-hub>=1.2.3",
    "lxml>=6.0.2",
    "praw>=7.8.1",
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.5",
    "redis>=7.1.0",
    "requests>=2.32.5",
    "selenium>=4.39.0",
]

[tool.uv]
cache-dir = ".cache"

